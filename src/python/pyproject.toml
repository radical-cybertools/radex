[build-system]
requires = [
    "setuptools",
    "Cython",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "radex"
version = "0.0.0"
dependencies = [
    "cloudpickle",
    "numpy",
]

[project.optional-dependencies]
orbit = [
    "radical.orbit",
]

[project.entry-points."radical.orbit.plugins"]
radex = "radex.orbit.plugin"
